<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>yein</title>

  <link rel="icon" href="/favicon.png" type="image/png">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: white;
      overflow: hidden;
      font-family: 'Times New Roman', serif;
      cursor: url('https://upload.wikimedia.org/wikipedia/commons/3/3d/Arrow_icon_black.svg'), auto;
    }

    /* 링크 컨테이너 */
    .container {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      gap: 5px; /* 링크 위아래 간격 */
      font-size: 80%;
    }

    a {
      text-decoration: none;
      color: black;
    }

    /* 커서 알파벳 효과 */
    .sparkle {
      position: absolute;
      color: black;
      opacity: 1;
      pointer-events: none;
      user-select: none;
      font-size: 6pt;
      animation: sparkleFloat 12s ease-out forwards; /* 12초 동안 떠오름 */
    }

    @keyframes sparkleFloat {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translate(0, -200px) scale(1.2) rotate(720deg);
        opacity: 0;
      }
    }

    /* 가운데 이미지 */
    .center-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px; /* 이미지 크기 */
      max-width: 90%;
    }
  </style>
</head>
<body>

  <!-- 링크 -->
  <div class="container">
    <a href="#">about</a>
    <a href="#">works</a>
    <a href="#">news</a>
  </div>

  <!-- 가운데 이미지 -->
  <img class="center-image" src="png.png" alt="table image">

  <!-- 커서 알파벳 효과 -->
  <script>
    const chars = 'abcdefghijklmnopqrstuvwxyz'.split('');
    const charsLen = chars.length;
    const rotateChance = 0.5;
    let lastTime = 0;
    const spawnInterval = 100; // ms

    document.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - lastTime < spawnInterval) return; 
      lastTime = now;

      if (Math.random() > 0.66) return; // 알파벳 개수 조절

      const char = chars[Math.floor(Math.random() * charsLen)];
      const sparkle = document.createElement('div');
      sparkle.classList.add('sparkle');
      sparkle.textContent = char;

      sparkle.style.left = `${e.clientX + (Math.random() * 10 - 5)}px`;
      sparkle.style.top = `${e.clientY + (Math.random() * 10 - 5)}px`;
      sparkle.style.fontSize = `${Math.floor(Math.random() * 2) + 6}px`;

      // 회전 랜덤
      if (Math.random() < rotateChance) {
        sparkle.style.animation = 'sparkleFloat 12s ease-out forwards'; 
      } else {
        sparkle.style.animation = 'sparkleFloat 12s ease-out forwards';
      }

      document.body.appendChild(sparkle);

      setTimeout(() => {
        sparkle.remove();
      }, 12000); // 12초 동안 유지
    });
  </script>

</body>
</html>
